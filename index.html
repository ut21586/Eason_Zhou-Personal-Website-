<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>周奕霖 Eason Zhou</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italianno&family=Ma+Shan+Zheng&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#0A1A34; --bg-deep:#01030A; --panel:rgba(12,26,54,.55); --panel-solid:#0B1833;
  --ink:#F4F0E4; --ink-2:#DCE4F2; --muted:#A9B9D4; --line:rgba(165,190,230,.22);
  --accent:#9CC3FF; --accent-strong:#D3E4FF; --seal:#B5372D; --seal-ink:#FBEFE6;
  --header:rgba(2,6,16,.78); --star:200,220,255;
  --kai:'Ma Shan Zheng','KaiTi','STKaiti','楷体',serif;
  --script:'Italianno','Snell Roundhand','Apple Chancery',cursive;
  --sans:-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI','Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1A34; --bg-deep:#01030A; --panel:rgba(12,26,54,.55); --panel-solid:#0B1833;
    --header:rgba(2,6,16,.78);
  }
}
:root[data-theme="dark"]{
  --bg:#0A1A34; --bg-deep:#01030A; --panel:rgba(12,26,54,.55); --panel-solid:#0B1833;
  --header:rgba(2,6,16,.78);
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(80px + env(safe-area-inset-top,0px));background:var(--bg-deep)}
body{margin:0;min-height:100%;background:var(--bg-deep);color:var(--ink-2);font-family:var(--sans);font-size:17px;line-height:1.8;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--header);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
a{color:var(--accent);text-underline-offset:3px;text-decoration-thickness:1px}
a:hover{color:var(--accent-strong)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
img{max-width:100%}
.kai{font-family:var(--kai);font-weight:400}
.script{font-family:var(--script);font-weight:400}

#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;
  /* real night sky: near-black at the zenith, deepening to a faint blue airglow at the horizon */
  background:
    radial-gradient(ellipse 150% 55% at 50% 118%,rgba(56,98,150,.30) 0%,rgba(28,58,104,.15) 38%,rgba(10,24,52,0) 72%),
    radial-gradient(ellipse 110% 70% at 88% 112%,rgba(72,62,120,.10) 0%,rgba(0,0,0,0) 60%),
    linear-gradient(180deg,var(--bg-deep) 0%,#020713 30%,#04102A 66%,var(--bg) 100%);}

/* header */
.top{position:fixed;top:0;left:0;right:0;z-index:30;padding-top:env(safe-area-inset-top,0px);background:var(--header);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;height:72px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;cursor:pointer;color:var(--ink)}
.seal{display:inline-flex;align-items:center;justify-content:center;writing-mode:vertical-rl;background:var(--seal);color:var(--seal-ink);font-family:var(--kai);border-radius:6px;line-height:1;letter-spacing:.04em}
.brand .seal{width:42px;height:42px;font-size:18px}
.brand-name{font-family:var(--script);font-size:34px;line-height:1;padding-top:4px}
.nav{display:flex;align-items:center;gap:4px}
.nav button,.lang,.menu-btn{font:inherit;font-size:15px;color:var(--muted);background:none;border:0;cursor:pointer;min-height:44px;padding:0 14px;border-radius:999px;transition:color .2s,background .2s}
.nav button:hover{color:var(--ink);background:rgba(156,195,255,.08)}
.nav button[aria-current="page"]{color:var(--ink);background:rgba(156,195,255,.14)}
.top-actions{display:flex;align-items:center;gap:10px}
.top-actions .lang{display:inline-flex;align-items:center;gap:2px;padding:4px;border:1px solid rgba(244,240,228,.45);background:rgba(244,240,228,.04);color:var(--ink)}
.top-actions .lang:hover{border-color:var(--ink);background:rgba(244,240,228,.08)}
.lang .opt{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:34px;padding:0 12px;border-radius:999px;font-size:14px;color:var(--muted);transition:background .25s,color .25s}
.lang .opt.on{background:var(--ink);color:#0A1A3B}
.menu-btn{display:none;color:var(--ink);border:1px solid var(--line)}
@media (max-width:860px){
  .menu-btn{display:inline-flex;align-items:center;gap:8px}
  .nav{position:absolute;top:calc(72px + env(safe-area-inset-top,0px));left:0;right:0;flex-direction:column;align-items:stretch;gap:2px;padding:12px 16px 20px;background:var(--panel-solid);border-bottom:1px solid var(--line);display:none}
  .nav.open{display:flex}
  .nav button{text-align:left;padding:0 16px}
}
@media (max-width:420px){.brand-name{display:none}}

/* views */
main{position:relative;z-index:1;padding-top:calc(72px + env(safe-area-inset-top,0px))}
.view{display:none;max-width:1240px;margin:0 auto;padding:64px 24px 96px;min-height:calc(100vh - 72px)}
.view.active{display:block;animation:viewIn .55s cubic-bezier(.2,.7,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.title{margin:0 0 48px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 24px}
.title .big{margin:0;color:var(--ink);line-height:1.05}
.title .big.kai{font-size:clamp(44px,6vw,68px)}
.title .big.script{font-size:clamp(64px,9vw,104px);line-height:.9}
.title .sub{color:var(--muted)}
.title .sub.script{font-size:36px;line-height:1}
.title .sub.kai{font-size:24px}

/* home */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(240px,360px);gap:48px 56px;align-items:center;min-height:calc(100vh - 72px - 160px)}
.vname{display:flex;flex-direction:column;align-items:center;gap:20px}
.vname h1{margin:0;writing-mode:vertical-rl;font-family:var(--kai);font-weight:400;font-size:clamp(84px,11vw,148px);line-height:1;letter-spacing:.12em;color:var(--ink)}
.vname .seal{width:56px;height:56px;font-size:24px}
.ename{margin:0;font-family:var(--script);font-weight:400;font-size:clamp(96px,14vw,188px);line-height:.82;color:var(--ink);letter-spacing:.005em}
.role{margin:28px 0 0;font-size:clamp(20px,2.2vw,26px);color:var(--ink-2);min-height:1.6em}
.role .rot{display:inline-block;color:var(--accent-strong);border-bottom:1px solid rgba(156,195,255,.5);transition:opacity .35s,transform .35s}
.role .rot.out{opacity:0;transform:translateY(-8px)}
.subline{margin:10px 0 0;color:var(--muted);font-size:17px}
/* CV-style home */
.cv-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:32px 56px;align-items:start;padding-top:8px}
.cv-head .portrait-wrap{grid-column:auto;justify-self:start;max-width:none;width:220px}
.cv-head .portrait img{object-fit:cover;object-position:50% 30%}
.cv-head .portrait{border-radius:14px}
.cv-name{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 28px;font-weight:400;color:var(--ink);line-height:1}
.cv-name .kai{font-size:clamp(60px,7.5vw,108px);letter-spacing:.06em}
.cv-name .script{font-size:clamp(84px,11vw,150px);line-height:.85}
.cv-info{margin:28px 0 0;display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 28px;font-size:18px;line-height:1.6}
.cv-info dt{color:var(--muted)}
.cv-info dd{margin:0;color:var(--ink);overflow-wrap:anywhere}
.cv-profile{margin-top:64px}
.cv-h{margin:0;padding-bottom:10px;border-bottom:1px solid rgba(156,195,255,.55);color:var(--ink);font-weight:400;line-height:1.1}
.cv-h.kai{font-size:clamp(38px,4.4vw,52px)}
.cv-h.script{font-size:clamp(56px,6.5vw,80px);line-height:.95}
.home-lead{margin:22px 0 0;max-width:52em;font-size:clamp(17px,1.5vw,19px);line-height:1.95;color:var(--ink)}
html[lang="en"] .home-lead{line-height:1.8;max-width:46em}
.ctas{margin-top:36px;display:flex;flex-wrap:wrap;gap:14px}
.btn{font:inherit;font-size:16px;cursor:pointer;min-height:48px;padding:0 26px;border-radius:999px;border:1px solid rgba(156,195,255,.55);background:rgba(156,195,255,.08);color:var(--ink);display:inline-flex;align-items:center;gap:10px;text-decoration:none;transition:background .2s,border-color .2s,transform .2s}
.btn:hover{background:rgba(156,195,255,.18);border-color:var(--accent);color:var(--ink)}
.btn.solid{background:var(--ink);color:#0A1A3B;border-color:var(--ink)}
.btn.solid:hover{background:#fff;color:#0A1A3B}
.hint{margin-top:28px;font-size:14px;color:var(--muted)}
.portrait-wrap{perspective:900px;justify-self:center;width:100%}
.portrait{position:relative;border-radius:180px 180px 14px 14px;overflow:hidden;border:1px solid rgba(165,190,230,.35);transform-style:preserve-3d;transition:transform .25s ease-out;box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}
.portrait img{display:block;width:100%;aspect-ratio:720/1010;object-fit:cover}
.portrait::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(8,22,51,.35));pointer-events:none}
@media (max-width:980px){
  .hero{grid-template-columns:auto minmax(0,1fr);}
  .portrait-wrap{grid-column:1 / -1;max-width:320px}
}
@media (max-width:600px){
  .hero{grid-template-columns:1fr;gap:32px;min-height:0}
  .vname{flex-direction:row;justify-content:flex-start}
  .vname h1{writing-mode:horizontal-tb;font-size:76px;letter-spacing:.06em}
  .portrait-wrap{max-width:260px;justify-self:start}
}

/* about */
.about{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);gap:40px 64px;align-items:start}
.lead{margin:0;font-size:clamp(18px,1.7vw,21px);line-height:2;color:var(--ink);max-width:40em}
.about[data-lang="en"] .lead{line-height:1.85}
.focus{margin-top:32px;display:flex;flex-wrap:wrap;gap:10px}
.chip{display:inline-flex;align-items:center;min-height:36px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:rgba(156,195,255,.06);color:var(--ink-2);font-size:15px;line-height:1.3}
.infocard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px 28px 20px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.infocard dl{margin:0;display:grid;grid-template-columns:max-content minmax(0,1fr);gap:12px 20px;font-size:16px;line-height:1.6}
.infocard dt{color:var(--muted)}
.infocard dd{margin:0;color:var(--ink);overflow-wrap:anywhere}
@media (max-width:860px){.about{grid-template-columns:1fr}}

/* experience */
.exp{display:grid;grid-template-columns:minmax(220px,320px) minmax(0,1fr);gap:32px 56px;align-items:start}
.exp-list{display:flex;flex-direction:column;gap:6px;position:relative}
.exp-tab{font:inherit;text-align:left;cursor:pointer;background:none;border:1px solid transparent;border-radius:14px;padding:16px 18px;color:var(--muted);display:flex;flex-direction:column;gap:2px;transition:background .2s,border-color .2s,color .2s}
.exp-tab .k{font-size:13px;color:var(--muted)}
.exp-tab .n{font-size:17px;color:var(--ink-2);line-height:1.45}
.exp-tab:hover{background:rgba(156,195,255,.07)}
.exp-tab[aria-selected="true"]{background:var(--panel);border-color:rgba(156,195,255,.45)}
.exp-tab[aria-selected="true"] .n{color:var(--ink)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:36px clamp(22px,3vw,40px);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:viewIn .4s cubic-bezier(.2,.7,.2,1)}
.panel h3{margin:0;font-size:clamp(21px,2vw,25px);font-weight:600;color:var(--ink);line-height:1.45}
.meta{margin:6px 0 0;color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}
.rolep{margin:10px 0 0;color:var(--ink-2)}
.links{margin:22px 0 0;display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center}
.links .lp{color:var(--muted);font-size:14px}
.links a{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid rgba(156,195,255,.5);text-decoration:none;font-size:15px}
.links a:hover{background:rgba(156,195,255,.12)}
.bullets{margin:26px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:18px}
.bullets li{padding-left:20px;border-left:1px solid rgba(165,190,230,.35)}
.bullets strong{color:var(--ink);font-weight:600}
.panel .plain{margin:18px 0 0}
@media (max-width:860px){.exp{grid-template-columns:1fr}.exp-list{flex-direction:row;overflow-x:auto;padding-bottom:4px}.exp-tab{flex:0 0 auto;max-width:280px}}

/* projects */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px}
.card{font:inherit;text-align:left;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:14px;padding:30px 28px 26px;min-height:300px;border-radius:22px;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);overflow:hidden;transition:transform .3s cubic-bezier(.2,.7,.2,1),border-color .3s;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(420px circle at var(--mx,50%) var(--my,0%),rgba(156,195,255,.16),transparent 45%);opacity:0;transition:opacity .3s;pointer-events:none}
.card:hover{transform:translateY(-4px);border-color:rgba(156,195,255,.55)}
.card:hover::before{opacity:1}
.card .d{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.card .t{font-size:21px;line-height:1.5;color:var(--ink);font-weight:600;margin:0}
.card .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.card .tags span{font-size:13px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.card .more{font-size:15px;color:var(--accent)}
dialog{width:min(860px,calc(100vw - 32px));max-height:calc(100vh - 48px);padding:0;border:1px solid rgba(156,195,255,.4);border-radius:22px;background:var(--panel-solid);color:var(--ink-2);box-shadow:0 40px 80px -20px rgba(0,0,0,.7)}
dialog::backdrop{background:rgba(4,12,30,.72);backdrop-filter:blur(4px)}
dialog[open]{animation:viewIn .35s cubic-bezier(.2,.7,.2,1)}
.dlg{padding:40px clamp(22px,4vw,48px) 44px;position:relative}
.dlg .close{position:absolute;top:16px;right:16px;width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer;font-size:22px;line-height:1}
.dlg .close:hover{background:rgba(156,195,255,.12)}
.dlg h3{margin:0;padding-right:48px;font-size:clamp(22px,2.4vw,28px);line-height:1.45;color:var(--ink);font-weight:600}

/* skills */
.skills{display:grid;grid-template-columns:minmax(220px,320px) minmax(0,1fr);gap:32px 56px;align-items:start}
.sk-chips{display:flex;flex-wrap:wrap;gap:12px;margin-top:4px}
.sk-chips .chip{font-size:16px;min-height:44px;padding:0 20px;border-color:rgba(156,195,255,.35);transition:transform .2s,background .2s,border-color .2s;animation:pop .45s cubic-bezier(.2,.7,.2,1) both}
.sk-chips .chip:hover{transform:translateY(-2px);background:rgba(156,195,255,.14);border-color:var(--accent)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
.sk-orig{margin:28px 0 0;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:15px}
@media (max-width:860px){.skills{grid-template-columns:1fr}}

/* contact */
.contact{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
.cbox dl{margin:0;display:grid;grid-template-columns:max-content minmax(0,1fr);gap:10px 18px;font-size:17px;line-height:1.6}
.cbox dt{color:var(--muted)}
.cbox dd{margin:0;color:var(--ink)}
.cbox{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:34px 32px;display:flex;flex-direction:column;gap:14px}
.cbox .lbl{color:var(--muted);font-size:15px}
.cbox .val{font-size:clamp(20px,2.4vw,28px);color:var(--ink);text-decoration:none;overflow-wrap:anywhere;line-height:1.4}
.cbox .val:hover{color:var(--accent-strong)}
.cbox .row{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px}
.status{min-height:1.6em;font-size:14px;color:var(--accent-strong)}
.bye{margin-top:72px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.bye .script{font-size:clamp(64px,9vw,112px);line-height:.9;color:var(--ink)}
.bye .kai{font-size:clamp(34px,4vw,48px);color:var(--ink-2)}
@media (max-width:760px){.contact{grid-template-columns:1fr}}

@media (max-width:700px){
  .cv-head{gap:20px}
  .cv-head .portrait-wrap{width:120px}
  .cv-name{gap:0 14px}
  .cv-name .kai{font-size:44px}
  .cv-name .script{font-size:64px}
  .cv-info{margin-top:16px;grid-template-columns:minmax(0,1fr);gap:0;font-size:15px;line-height:1.45}
  .cv-info dt{font-size:13px}
  .cv-info dd{margin-bottom:8px;overflow-wrap:normal;word-break:break-all}
  .cv-info dd a{white-space:nowrap}
}

/* keep the photo exactly as tall as the name + info block beside it */
let portraitRO=null;
function fitPortrait(){
  const head=$(".cv-head"), id=$(".cv-id"), wrap=head&&head.querySelector(".portrait-wrap"), img=wrap&&wrap.querySelector("img");
  if(!head||!id||!wrap||!img) return;
  let n=0, raf=0;
  const set=()=>{
    const h=id.getBoundingClientRect().height; if(!h) return;
    let w=h*720/1010; const max=head.clientWidth*0.42; if(w>max) w=max;
    if(Math.abs(wrap.getBoundingClientRect().width-w)>0.5) wrap.style.width=w+"px";
    const fr=wrap.querySelector(".portrait"), bd=fr?(fr.offsetHeight-img.offsetHeight):0;
    img.style.height=Math.max(0,h-bd)+"px";
  };
  const queue=()=>{ cancelAnimationFrame(raf); raf=requestAnimationFrame(()=>{ if(n++<8) set(); }); };
  set();
  if(portraitRO) portraitRO.disconnect();
  if(window.ResizeObserver){ portraitRO=new ResizeObserver(queue); portraitRO.observe(id); portraitRO.observe(head); }
  window.addEventListener("resize",()=>{ n=0; queue(); });
  try{ document.fonts&&document.fonts.ready.then(()=>{ n=0; queue(); }); }catch(e){}
  setTimeout(()=>{ n=0; queue(); },60);
}

  document.querySelectorAll("#nav [data-go]").forEach(b=>{ b.textContent=u.nav[b.dataset.go]; b.setAttribute("aria-current", b.dataset.go===view?"page":"false"); });
  const lb=$("#langBtn"); lb.innerHTML='<span class="opt'+(lang==="zh"?" on":"")+'" lang="zh-CN">中文</span><span class="opt'+(lang==="en"?" on":"")+'" lang="en">EN</span>'; lb.setAttribute("aria-label",u.langAria);
  $("#menuLabel").textContent=u.menu;
  $(".brand").setAttribute("aria-label",u.brandAria);
  $("#nav").setAttribute("aria-label", lang==="zh"?"主导航":"Main");
}
function renderAll(){ renderChrome(); renderHome(); renderExp(); renderProjects(); renderSkills(); renderContact(); show(view,false); }

function show(v, push=true){
  view=v;
  document.querySelectorAll(".view").forEach(s=>s.classList.toggle("active", s.dataset.view===v));
  document.querySelectorAll("#nav [data-go]").forEach(b=>b.setAttribute("aria-current", b.dataset.go===v?"page":"false"));
  if(push){ try{ history.replaceState(null,"","#"+v);}catch(e){} window.scrollTo({top:0,behavior:"auto"}); }
  closeMenu();
  sky.mode = v==="home" ? 1 : .55;
}

/* rotating role */
function startRoles(){
  clearInterval(roleTimer);
  if(reduce) return;

  roleTimer=setInterval(()=>{

  },2600);
}
/* portrait tilt */
function bindTilt(){
  if(reduce) return;
  const hero=$("#hero"), p=$("#portrait"); if(!hero||!p) return;
  hero.addEventListener("pointermove",e=>{
    const r=p.getBoundingClientRect(); const x=(e.clientX-(r.left+r.width/2))/r.width, y=(e.clientY-(r.top+r.height/2))/r.height;
    p.style.transform=`rotateY(${Math.max(-1,Math.min(1,x))*10}deg) rotateX(${Math.max(-1,Math.min(1,-y))*8}deg)`;

async function copyEmail(){
  const s=$("#copyStatus"), u=D[lang].ui;
  try{ await navigator.clipboard.writeText(EMAIL); s.textContent=u.copied; }
  catch(err){
    try{ const t=document.createElement("textarea"); t.value=EMAIL; t.setAttribute("readonly",""); t.style.position="fixed"; t.style.opacity="0"; document.body.appendChild(t); t.select(); const ok=document.execCommand("copy"); t.remove(); s.textContent= ok?u.copied:u.copyFail; }
    catch(e2){ s.textContent=u.copyFail; }
  }
  setTimeout(()=>{ if(s) s.textContent=""; },3200);
}

/* constellation background */
const cv=$("#sky"), ctx=cv.getContext("2d");
const sky={pts:[],mouse:{x:-9999,y:-9999,on:false},mode:1,w:0,h:0,raf:0};
function starColor(){ return getComputedStyle(document.documentElement).getPropertyValue("--star").trim() || "200,220,255"; }
let SC=starColor();
function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  sky.w=window.innerWidth; sky.h=window.innerHeight;
  cv.width=sky.w*dpr; cv.height=sky.h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  const n=Math.max(28,Math.min(95,Math.round(sky.w*sky.h/16000)));
  sky.pts=Array.from({length:n},()=>({x:Math.random()*sky.w,y:Math.random()*sky.h,vx:(Math.random()-.5)*.28,vy:(Math.random()-.5)*.28,r:Math.random()*1.4+.5}));
  layoutLibra(); buildNebula(); buildStarfield();
  if(reduce) draw(false);
}
function draw(move){
  const {pts,mouse,w,h}=sky; const m=sky.mode;
  ctx.clearRect(0,0,w,h);
  const t=performance.now(); drawStarfield(t); drawNebula(t);
  const L=130, ML=190;
  for(const p of pts){
    if(move){
      if(mouse.on){ const dx=mouse.x-p.x, dy=mouse.y-p.y, d=Math.hypot(dx,dy); if(d<ML&&d>1){ p.vx+=dx/d*.012; p.vy+=dy/d*.012; } }
      p.vx*=.992; p.vy*=.992;
      const sp=Math.hypot(p.vx,p.vy); if(sp<.06){ p.vx+=(Math.random()-.5)*.04; p.vy+=(Math.random()-.5)*.04; }
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<-10)p.x=w+10; if(p.x>w+10)p.x=-10; if(p.y<-10)p.y=h+10; if(p.y>h+10)p.y=-10;
    }
  }
  ctx.lineWidth=1;
  for(let i=0;i<pts.length;i++){
    const a=pts[i];
    for(let j=i+1;j<pts.length;j++){
      const b=pts[j], dx=a.x-b.x, dy=a.y-b.y, d2=dx*dx+dy*dy;
      if(d2<L*L){ const al=(1-Math.sqrt(d2)/L)*.22*m; ctx.strokeStyle=`rgba(${SC},${al})`; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
    }
    if(mouse.on){ const d=Math.hypot(a.x-mouse.x,a.y-mouse.y); if(d<ML){ ctx.strokeStyle=`rgba(${SC},${(1-d/ML)*.5*m})`; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(mouse.x,mouse.y); ctx.stroke(); } }
    ctx.fillStyle=`rgba(${SC},${.75*m})`; ctx.beginPath(); ctx.arc(a.x,a.y,a.r,0,Math.PI*2); ctx.fill();
  }
  drawLibra(t);
}
/* ---- Libra (天秤座) constellation + nebula ---- */
/* star layout from approximate real RA/Dec of Libra's main stars (east to the left, as seen in the sky) */
const LIBRA_RAW=[
  ["α",6.92,-1.97,2.75,"α Lib  氐宿一  Zubenelgenubi"],
  ["β",0.71,-8.62,2.61,"β Lib  氐宿四  Zubeneschamali"],
  ["σ",3.79,7.28,3.29,"σ Lib  Brachium"],
  ["γ",-3.69,-3.21,3.91,"γ Lib  氐宿三  Zubenelhakrabi"],
  ["υ",-4.05,10.13,3.58,"υ Lib"],
  ["τ",-4.43,11.78,3.66,"τ Lib"],
  ["θ",-8.05,-1.27,4.15,"θ Lib"]
];
const LIBRA_LINES=[["σ","α"],["α","β"],["β","γ"],["γ","α"],["γ","υ"],["υ","τ"],["γ","θ"]];
const libra={cx:0,cy:0,S:0,alpha:1,t0:performance.now()};
const neb={c:null,size:0};
function layoutLibra(){
  const w=sky.w,h=sky.h,wide=w>=980;
  libra.cx = wide ? w*0.77 : w*0.62;
  libra.cy = wide ? h*0.5 : h*0.58;
  libra.S  = wide ? Math.min(h*0.64,w*0.34) : Math.min(w*0.9,h*0.55);
  libra.alpha = wide ? 1 : .6;
  libra.wide = wide;
}
function buildNebula(){
  const size=Math.round(libra.S*1.9); if(size<20){neb.c=null;return;}
  const c=document.createElement("canvas"); c.width=c.height=size; const g=c.getContext("2d");
  let seed=20020930; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  const C=size/2;
  const cols=["110,80,220","170,90,210","60,150,230","90,190,225","205,140,235"];
  const blob=(x,y,r,col,a)=>{ const gr=g.createRadialGradient(x,y,0,x,y,r); gr.addColorStop(0,`rgba(${col},${a})`); gr.addColorStop(.45,`rgba(${col},${a*.45})`); gr.addColorStop(1,`rgba(${col},0)`); g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill(); };
  g.globalCompositeOperation="lighter";
  for(let i=0;i<48;i++){ const an=rnd()*Math.PI*2, d=Math.pow(rnd(),.8)*size*.33; blob(C+Math.cos(an)*d*1.15, C+Math.sin(an)*d*.82, size*(.06+rnd()*.16), cols[(rnd()*cols.length)|0], .05+rnd()*.07); }
  blob(C*1.03,C*.95,size*.17,"215,205,255",.15);
  blob(C*.9,C*1.12,size*.12,"120,200,235",.1);
  for(let i=0;i<280;i++){ const an=rnd()*Math.PI*2, d=Math.pow(rnd(),.6)*size*.43, s=rnd()<.9?1:1.7; g.fillStyle=`rgba(235,238,255,${.15+rnd()*.5})`; g.fillRect(C+Math.cos(an)*d, C+Math.sin(an)*d*.85, s, s); }
  g.globalCompositeOperation="destination-out";
  for(let i=0;i<11;i++){ const x=C+(rnd()-.5)*size*.5, y=C+(rnd()-.5)*size*.4, r=size*(.04+rnd()*.07); const gr=g.createRadialGradient(x,y,0,x,y,r); gr.addColorStop(0,"rgba(0,0,0,.35)"); gr.addColorStop(1,"rgba(0,0,0,0)"); g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill(); }
  neb.c=c; neb.size=size;
}
function par(k){ const mo=sky.mouse; if(!mo.on||reduce) return [0,0]; return [(mo.x-sky.w/2)*k,(mo.y-sky.h/2)*k]; }
function drawNebula(t){
  if(!neb.c) return;
  const m=sky.mode, [px,py]=par(-0.012), br=reduce?1:1+Math.sin(t*0.00016)*0.035;
  ctx.save();
  ctx.translate(libra.cx+px,libra.cy+py);
  ctx.globalAlpha=.6*m*libra.alpha; ctx.rotate(reduce?0:t*0.000005); ctx.scale(br,br);
  ctx.drawImage(neb.c,-neb.size/2,-neb.size/2);
  ctx.globalAlpha=.26*m*libra.alpha; ctx.rotate(reduce?0:-t*0.000012); ctx.scale(1.25,1.25);
  ctx.drawImage(neb.c,-neb.size/2,-neb.size/2);
  ctx.restore();
}
function drawLibra(t){
  const m=sky.mode, A=libra.alpha*m, S=libra.S/20.4, [px,py]=par(-0.022);
  const sway=reduce?0:Math.sin(t*0.00028)*0.03;            /* the scale gently balances */
  const cx=libra.cx+px, cy=libra.cy+py, cs=Math.cos(sway), sn=Math.sin(sway);
  const P={};
  for(const s of LIBRA_RAW){ const x=(s[1]+0.57)*S, y=(s[2]-1.58)*S; P[s[0]]={x:cx+x*cs-y*sn,y:cy+x*sn+y*cs,mag:s[3],label:s[4]}; }
  const N=LIBRA_LINES.length, prog=reduce?N:Math.min(N,(t-libra.t0)/1000);
  ctx.save(); ctx.lineCap="round"; ctx.shadowColor="rgba(160,190,255,.9)"; ctx.shadowBlur=10; ctx.lineWidth=1.3;
  ctx.strokeStyle=`rgba(190,210,255,${.5*A})`;
  LIBRA_LINES.forEach((l,i)=>{ const f=Math.max(0,Math.min(1,prog-i)); if(!f) return; const a=P[l[0]],b=P[l[1]]; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(a.x+(b.x-a.x)*f,a.y+(b.y-a.y)*f); ctx.stroke(); });
  ctx.restore();
  if(!reduce && prog>=N){ /* light pulse travelling along the figure */
    const k=((t-libra.t0)*0.0001)%1*N, i=Math.floor(k), f=k-i, a=P[LIBRA_LINES[i][0]], b=P[LIBRA_LINES[i][1]];
    const x=a.x+(b.x-a.x)*f, y=a.y+(b.y-a.y)*f, g=ctx.createRadialGradient(x,y,0,x,y,11);
    g.addColorStop(0,`rgba(235,242,255,${.9*A})`); g.addColorStop(1,"rgba(235,242,255,0)"); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,11,0,Math.PI*2); ctx.fill();
  }
  const mo=sky.mouse; let hover=null;
  LIBRA_RAW.forEach((s,i)=>{
    const p=P[s[0]], tw=reduce?1:.78+.22*Math.sin(t*0.0009+i*1.7);
    let near=0; if(mo.on){ const d=Math.hypot(mo.x-p.x,mo.y-p.y); if(d<70){ near=1-d/70; if(!hover||near>hover.n) hover={p,n:near}; } }
    const r=((4.6-p.mag)*1.5+1.6)*(1+near*.6);
    const gr=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r*6);
    gr.addColorStop(0,`rgba(225,235,255,${.55*tw*A})`); gr.addColorStop(.25,`rgba(160,190,255,${.22*tw*A})`); gr.addColorStop(1,"rgba(160,190,255,0)");
    ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(p.x,p.y,r*6,0,Math.PI*2); ctx.fill();
    if(p.mag<3.4){ const L=r*4.2*tw; ctx.strokeStyle=`rgba(235,240,255,${.5*tw*A})`; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(p.x-L,p.y); ctx.lineTo(p.x+L,p.y); ctx.moveTo(p.x,p.y-L); ctx.lineTo(p.x,p.y+L); ctx.stroke(); }
    ctx.fillStyle=`rgba(250,250,255,${Math.min(1,.9*A+.1)})`; ctx.beginPath(); ctx.arc(p.x,p.y,r*.55,0,Math.PI*2); ctx.fill();
  });
  /* constellation name: fades in after the lines finish drawing (wide screens only) */
  const la=reduce?1:Math.max(0,Math.min(1,(t-libra.t0-N*1000)/2000));
  if(la>0 && libra.wide){
    const bx=P["β"].x, by=P["β"].y-34;
    ctx.save(); ctx.textAlign="center"; ctx.textBaseline="alphabetic";
    ctx.fillStyle=`rgba(244,240,228,${.75*la*A})`;
    ctx.font="28px 'Ma Shan Zheng','KaiTi','STKaiti',serif"; ctx.fillText("天秤座",bx-42,by);
    ctx.font="40px 'Italianno','Snell Roundhand',cursive"; ctx.fillText("Libra",bx+46,by+2);
    ctx.restore();
  }
}
/* ---- dense, realistic star field (pre-rendered) + slow twinkling ---- */
const field={c:null,pad:24,tw:[]};
function buildStarfield(){
  const w=sky.w,h=sky.h,pad=field.pad,dpr=Math.min(window.devicePixelRatio||1,2);
  const W=w+pad*2,H=h+pad*2; if(W<10||H<10){field.c=null;return;}
  const c=document.createElement("canvas"); c.width=Math.round(W*dpr); c.height=Math.round(H*dpr);
  const g=c.getContext("2d"); g.scale(dpr,dpr);
  let seed=930; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  const gauss=()=>{ let u=0,v=0; while(!u)u=rnd(); while(!v)v=rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };
  /* star colours by temperature: blue-white, white, pale yellow, orange */
  const COLS=[[190,210,255],[205,220,255],[255,255,255],[255,255,255],[255,244,224],[255,226,190],[255,206,170]];
  /* faint Milky Way glow along a diagonal band */
  const bx0=-0.1*W, by0=1.05*H, bx1=1.1*W, by1=-0.15*H, bl=Math.hypot(bx1-bx0,by1-by0), nx=-(by1-by0)/bl, ny=(bx1-bx0)/bl, bandW=Math.min(W,H)*0.16;
  g.save(); g.globalCompositeOperation="lighter";
  for(let i=0;i<26;i++){ const k=rnd(), off=gauss()*bandW*.45; const x=bx0+(bx1-bx0)*k+nx*off, y=by0+(by1-by0)*k+ny*off, r=bandW*(.7+rnd()*.9);
    const gr=g.createRadialGradient(x,y,0,x,y,r); gr.addColorStop(0,"rgba(170,185,235,.035)"); gr.addColorStop(1,"rgba(170,185,235,0)"); g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill(); }
  g.restore();
  const area=w*h, nMain=Math.round(Math.max(420,Math.min(1700,area/780))), nBand=Math.round(nMain*.9);
  field.tw=[];
  const star=(x,y,b)=>{
    const col=COLS[(rnd()*COLS.length)|0], r=.28+b*1.25, a=.22+b*.72;
    if(b>.72){ const gr=g.createRadialGradient(x,y,0,x,y,r*5); gr.addColorStop(0,`rgba(${col},${.32*b})`); gr.addColorStop(1,`rgba(${col},0)`); g.fillStyle=gr; g.beginPath(); g.arc(x,y,r*5,0,Math.PI*2); g.fill(); }
    g.fillStyle=`rgba(${col},${a})`; g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill();
    if(b>.38 && field.tw.length<170 && rnd()<.45) field.tw.push({x:x-pad,y:y-pad,r:r*1.15,col:col.join(","),a:.35+b*.5,sp:.0005+rnd()*.0011,ph:rnd()*Math.PI*2});
  };
  for(let i=0;i<nMain;i++) star(rnd()*W,rnd()*H,Math.pow(rnd(),3.2));
  for(let i=0;i<nBand;i++){ const k=rnd(), off=gauss()*bandW*.5; star(bx0+(bx1-bx0)*k+nx*off, by0+(by1-by0)*k+ny*off, Math.pow(rnd(),4.2)*.8); }
  field.c=c;
}
function drawStarfield(t){
  if(!field.c) return;
  const pad=field.pad, [px,py]=par(-0.005), fa=.78+.22*sky.mode;
  ctx.save(); ctx.globalAlpha=fa;
  ctx.drawImage(field.c,-pad+px,-pad+py,sky.w+pad*2,sky.h+pad*2);
  if(!reduce){
    for(const s of field.tw){ const k=.5+.5*Math.sin(t*s.sp+s.ph); const a=s.a*k*k;
      if(a<.02) continue; ctx.fillStyle=`rgba(${s.col},${a})`; ctx.beginPath(); ctx.arc(s.x+px,s.y+py,s.r,0,Math.PI*2); ctx.fill(); }
  }
  ctx.restore();
}
function loop(){ if(!document.hidden) draw(true); sky.raf=requestAnimationFrame(loop); }
window.addEventListener("resize",()=>{ resize(); });
window.addEventListener("pointermove",e=>{ sky.mouse.x=e.clientX; sky.mouse.y=e.clientY; sky.mouse.on=true; if(reduce) draw(false); },{passive:true});
window.addEventListener("pointerleave",()=>{ sky.mouse.on=false; });
document.addEventListener("pointerleave",()=>{ sky.mouse.on=false; });
window.addEventListener("hashchange",()=>{ const h=location.hash.slice(1); if(VIEWS.includes(h)&&h!==view) show(h,false); });

resize();
renderAll();
if(!reduce) loop();
})();
</script>
